name: Build Patches

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Patches
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Tests
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:testDebugUnitTest

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gboard-patches
          path: |
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json
